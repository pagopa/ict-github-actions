# This action deploys a Python package to a Azure Function App .

name: Deploy Python Function App
description: Deploy a Python package to Azure Function App

inputs:
  python-version-file:
    required: true
    description: Path of the Python version file
  tenant-id:
    required: true
    description: Azure Tenant ID
  subscription-id:
    required: true
    description: Azure Subscription ID
  client-id:
    required: true
    description: Azure Client ID
  app-name:
    required: true
    description: Name of the Function App
  package:
    required: false
    description: Path of the package to publish
    default: '.'

runs:
  using: composite
  steps:
    - name: Login via Azure CLI
      uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
      with:
        tenant-id: ${{ inputs.tenant-id }}
        subscription-id: ${{ inputs.subscription-id }}
        client-id: ${{ inputs.client-id }}

    - name: Setup Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version-file: ${{ inputs.python-version-file }}
        cache: 'pip'
        architecture: 'x64'

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.package }}
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt --target=".python_packages/lib/site-packages"

    - name: Deploy function app
      uses: Azure/functions-action@c5060b3b8bb1ebbcb531abd00c822ecbaa8ea656 # v1.5.7
      with:
        app-name: ${{ inputs.app-name }}
        package: ${{ inputs.package }}
        scm-do-build-during-deployment: true
        enable-oryx-build: true
