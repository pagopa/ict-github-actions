name: Terraform CD

on:
  workflow_call:
    inputs:
      environment-plan:
        type: string
        required: true
        description: GitHub environment for plan
      environment-apply:
        type: string
        required: true
        description: GitHub environment for apply
      terraform-environment:
        type: string
        required: true
        description: Terraform environment folder name in which backend config and tfvars are stored
      terraform-root:
        type: string
        required: true
        description: Root directory of the Terraform script to execute
    secrets:
      ARM_TENANT_ID:
        required: true
        description: Azure Tenant ID
      ARM_SUBSCRIPTION_ID:
        required: true
        description: Azure Subscription ID
      ARM_CLIENT_ID:
        required: true
        description: Azure Client ID of the managed identity that the job will authenticate with
      TERRAFORM_PLAN_CERT:
        required: true
        description: PEM certificate (public key) used to encrypt the Terraform plan artifact
      TERRAFORM_PLAN_PRIVATE_KEY:
        required: true
        description: PEM private key used to decrypt the Terraform plan artifact (store it only in the apply environment)

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment-plan }}

    permissions:
      id-token: write
      contents: read
      pull-requests: write

    outputs:
      plan-artifact-name: ${{ steps.plan.outputs.plan-artifact-name }}
      plan-artifact-file: ${{ steps.plan.outputs.plan-artifact-file }}
      has-changes: ${{ steps.plan.outputs.has-changes }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Azure Login
        uses: azure/login@a65d910e8af852a8061c627c456678983e180302 # v2.2.0
        with:
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          client-id: ${{ secrets.ARM_CLIENT_ID }}

      - name: Terraform Init
        uses: pagopa/ict-github-actions/terraform-init@0afcfeaeaa10de8a0a841fe578c3e5a2a924dff3 # v7.0.0
        with:
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          terraform-root: ${{ inputs.terraform-root }}
          terraform-env: ${{ inputs.terraform-environment }}

      - name: Terraform Plan
        uses: pagopa/ict-github-actions/terraform-plan@0afcfeaeaa10de8a0a841fe578c3e5a2a924dff3 # v7.0.0
        id: plan
        with:
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          terraform-root: ${{ inputs.terraform-root }}
          terraform-tfvars-file: env/${{ inputs.terraform-environment }}/terraform.tfvars
          terraform-plan-encryption-cert: ${{ secrets.TERRAFORM_PLAN_CERT }}

  apply:
    name: Apply
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment-apply }}
    needs: plan
    if: needs.plan.outputs.has-changes == 'true'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Azure Login
        uses: azure/login@a65d910e8af852a8061c627c456678983e180302 # v2.2.0
        with:
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          client-id: ${{ secrets.ARM_CLIENT_ID }}

      - name: Terraform Init
        uses: pagopa/ict-github-actions/terraform-init@0afcfeaeaa10de8a0a841fe578c3e5a2a924dff3 # v7.0.0
        with:
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          terraform-root: ${{ inputs.terraform-root }}
          terraform-env: ${{ inputs.terraform-environment }}

      - name: Download Plan Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.plan.outputs.plan-artifact-name }}
          path: ${{ inputs.terraform-root }}

      - name: Decrypt plan artifact
        env:
          DECRYPTION_KEY: ${{ secrets.TERRAFORM_PLAN_PRIVATE_KEY }}
          PLAN_PATH: ${{ inputs.terraform-root }}/${{ needs.plan.outputs.plan-artifact-file }}
        run: |
          [ -n "$DECRYPTION_KEY" ] || { echo "::error::TERRAFORM_PLAN_PRIVATE_KEY is empty"; exit 1; }
          KEY_FILE="$RUNNER_TEMP/terraform-plan-key.pem"
          trap 'rm -f "$KEY_FILE"' EXIT
          (umask 077 && printf '%s\n' "$DECRYPTION_KEY" > "$KEY_FILE")
          openssl cms -decrypt -binary \
            -inform DER -in "$PLAN_PATH.enc" \
            -inkey "$KEY_FILE" \
            -out "$PLAN_PATH"

      - name: Terraform Apply
        uses: pagopa/ict-github-actions/terraform-apply@0afcfeaeaa10de8a0a841fe578c3e5a2a924dff3 # v7.0.0
        with:
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          terraform-root: ${{ inputs.terraform-root }}
          terraform-plan-file: ${{ needs.plan.outputs.plan-artifact-file }}
