name: Terraform CD

on:
  workflow_call:
    inputs:
      environment-plan:
        type: string
        required: true
        description: GitHub environment for plan
      environment-apply:
        type: string
        required: true
        description: GitHub environment for apply
      terraform-environment:
        type: string
        required: true
        description: Terraform environment folder name in which backend config and tfvars are stored
      terraform-root:
        type: string
        required: true
        description: Root directory of the Terraform script to execute
    secrets:
      ARM_TENANT_ID:
        required: true
        description: Azure Tenant ID
      ARM_SUBSCRIPTION_ID:
        required: true
        description: Azure Subscription ID
      ARM_CLIENT_ID:
        required: true
        description: Azure Client ID of the managed identity that the job will authenticate with
      TERRAFORM_PLAN_ENCRYPTION_KEY:
        required: true
        description: Passphrase used to encrypt the Terraform plan artifact

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment-plan }}

    permissions:
      id-token: write
      contents: read
      pull-requests: write

    outputs:
      plan-artifact-name: ${{ steps.plan.outputs.plan-artifact-name }}
      plan-artifact-file: ${{ steps.plan.outputs.plan-artifact-file }}
      has-changes: ${{ steps.plan.outputs.has-changes }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Azure Login
        uses: azure/login@a65d910e8af852a8061c627c456678983e180302 # v2.2.0
        with:
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          client-id: ${{ secrets.ARM_CLIENT_ID }}

      - name: Terraform Init
        uses: pagopa/ict-github-actions/terraform-init@8b93d7ff9690abcadaff6a519dc814b2bed093c8 # v6.0.0
        with:
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          terraform-root: ${{ inputs.terraform-root }}
          terraform-env: ${{ inputs.terraform-environment }}

      - name: Terraform Plan
        uses: pagopa/ict-github-actions/terraform-plan@8b93d7ff9690abcadaff6a519dc814b2bed093c8 # v6.0.0
        id: plan
        with:
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          terraform-root: ${{ inputs.terraform-root }}
          terraform-tfvars-file: env/${{ inputs.terraform-environment }}/terraform.tfvars
          terraform-plan-encryption-key: ${{ secrets.TERRAFORM_PLAN_ENCRYPTION_KEY }}

  apply:
    name: Apply
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment-apply }}
    needs: plan
    if: needs.plan.outputs.has-changes == 'true'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Azure Login
        uses: azure/login@a65d910e8af852a8061c627c456678983e180302 # v2.2.0
        with:
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          client-id: ${{ secrets.ARM_CLIENT_ID }}

      - name: Terraform Init
        uses: pagopa/ict-github-actions/terraform-init@8b93d7ff9690abcadaff6a519dc814b2bed093c8 # v6.0.0
        with:
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          terraform-root: ${{ inputs.terraform-root }}
          terraform-env: ${{ inputs.terraform-environment }}

      - name: Download Plan Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.plan.outputs.plan-artifact-name }}
          path: ${{ inputs.terraform-root }}

      - name: Decrypt plan artifact
        env:
          SECRET_KEY: ${{ secrets.TERRAFORM_PLAN_ENCRYPTION_KEY }}
          PLAN_PATH: ${{ inputs.terraform-root }}/${{ needs.plan.outputs.plan-artifact-file }}
        run: |
          [ -n "$SECRET_KEY" ] || { echo "::error::TERRAFORM_PLAN_ENCRYPTION_KEY is empty"; exit 1; }
          gpg --decrypt \
            --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 \
            -o "$PLAN_PATH" "$PLAN_PATH.gpg" <<< "$SECRET_KEY"

      - name: Terraform Apply
        uses: pagopa/ict-github-actions/terraform-apply@8b93d7ff9690abcadaff6a519dc814b2bed093c8 # v6.0.0
        with:
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          terraform-root: ${{ inputs.terraform-root }}
          terraform-plan-file: ${{ needs.plan.outputs.plan-artifact-file }}
